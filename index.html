<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b·side</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Anton&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div id="backdrop" class="backdrop">
    <div class="blur"></div>
    <div class="shade"></div>
  </div>

  <header class="topbar" id="topbar">
    <button class="brand" id="go-home" aria-label="Library home">
      <span class="dot-ring"><span class="dot" id="brand-dot"></span></span>
      <span class="word">b&middot;side</span>
    </button>
    <nav class="topnav" id="topnav"></nav>
    <div class="topbar-right" id="topbar-right"></div>
  </header>

  <!-- HOME -->
  <main class="view view-home" id="view-home">
    <section class="hero">
      <button class="hero-art" id="hero-art" aria-label="Open turntable">
        <span class="hero-vinyl" id="hero-vinyl"><span class="hero-vinyl-label" id="hero-vinyl-label"></span></span>
        <span class="hero-cover" id="hero-cover"></span>
      </button>
      <div class="hero-meta">
        <span class="hero-state" id="hero-state"></span>
        <span class="hero-title" id="hero-title"></span>
        <span class="hero-sub" id="hero-sub"></span>
      </div>
      <div class="hero-actions">
        <button class="pill pill-accent" id="hero-toggle"></button>
        <button class="pill pill-outline" id="hero-open">Turntable</button>
      </div>
    </section>

    <section class="playlists-section">
      <div class="playlists-head">
        <h1>Your playlists</h1>
        <span class="hint">Press a song to drop the needle.</span>
      </div>
      <div class="playlists-grid" id="playlists-grid"></div>
    </section>
  </main>

  <!-- PLAYLIST -->
  <main class="view view-list" id="view-list">
    <button class="back-link" id="list-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      All playlists
    </button>
    <div class="list-head">
      <span class="list-disc">
        <span class="list-disc-ring"><span class="list-disc-dot" id="list-disc-dot"></span></span>
        <span class="list-disc-cover" id="list-disc-cover"></span>
      </span>
      <div class="list-head-meta">
        <span class="eyebrow">Playlist</span>
        <h1 id="list-title"></h1>
        <span class="muted" id="list-sub"></span>
      </div>
      <button class="pill pill-accent" id="list-play-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#131211"><path d="M7 4.5v15l13-7.5z"></path></svg>
        Play all
      </button>
    </div>
    <div class="list-columns">
      <span>#</span><span>Title</span><span>Artist</span><span class="right">Time</span>
    </div>
    <div class="list-rows" id="list-rows"></div>
  </main>

  <!-- CRATE -->
  <main class="view view-crate" id="view-crate">
    <div class="crate-head">
      <div class="crate-heading">
        <h1>The record crate</h1>
        <p>20 pressings. The player reads each cover&rsquo;s main colour and spins the closest one. Click a pressing to put it on the platter yourself.</p>
      </div>
      <div class="crate-now" id="crate-now">
        <span class="crate-now-cover" id="crate-now-cover"></span>
        <span class="crate-now-meta">
          <span>Now spinning &middot; cover <span class="mono" id="crate-hex"></span></span>
          <span class="crate-match" id="crate-match"></span>
        </span>
        <button class="pill pill-ghost" id="crate-auto-match">Auto-match</button>
      </div>
    </div>
    <div class="crate-grid" id="crate-grid"></div>
  </main>

  <!-- PLAYER -->
  <main class="view view-player" id="view-player">
    <div class="stage" id="stage">
      <div class="stage-inner" id="stage-inner">

        <div class="player-left">
          <div class="player-cover" id="player-cover">
            <span class="player-cover-title" id="player-cover-title"></span>
            <span class="player-cover-artist" id="player-cover-artist"></span>
            <span class="player-cover-sheen"></span>
          </div>
          <div class="player-meta">
            <button class="player-led" id="player-close">
              <span class="led-dot" id="led-dot"></span>
              <span id="player-state-label"></span>
            </button>
            <span class="player-title" id="player-title"></span>
            <span class="player-artist" id="player-artist"></span>
            <button class="pressing-chip" id="player-open-crate">
              <span class="pressing-dot" id="pressing-dot"></span>
              <span id="pressing-name"></span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.7"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
          </div>
          <div class="up-next">
            <span class="eyebrow">Up next</span>
            <div id="up-next-rows"></div>
          </div>
        </div>

        <div class="player-right">
          <div class="turntable">
            <div class="platter"></div>
            <div class="disc" id="disc">
              <div class="label" id="disc-label">
                <span class="label-ring"></span>
                <span class="label-top">
                  <span class="label-side">Side B</span>
                  <span class="label-title" id="disc-title"></span>
                </span>
                <span class="label-gap"></span>
                <span class="label-bottom">
                  <span class="label-artist" id="disc-artist"></span>
                  <span class="label-rpm" id="disc-rpm"></span>
                </span>
              </div>
            </div>
            <div class="disc-sheen"></div>
            <div class="spindle"></div>
            <div class="headshell-base"></div>
            <div class="headshell-ring"></div>
            <div class="pivot-foot"></div>
            <div class="tonearm" id="tonearm">
              <div class="arm-wire"></div>
              <div class="arm-mid"></div>
              <div class="arm-tube"></div>
              <div class="headshell">
                <div class="hs-body"></div>
                <div class="hs-tip"></div>
                <div class="cartridge"></div>
                <div class="stylus-box"></div>
                <div class="stylus-stripe" id="stylus-stripe"></div>
                <div class="stylus-tip"></div>
              </div>
              <div class="pivot-cap-outer"></div>
              <div class="pivot-cap-inner"></div>
            </div>
          </div>

          <div class="transport">
            <div class="seek-row">
              <span class="mono" id="pos-label"></span>
              <div class="seek-track" id="seek-track">
                <div class="seek-bg">
                  <div class="seek-fill" id="seek-fill"></div>
                  <div class="seek-knob" id="seek-knob"></div>
                </div>
              </div>
              <span class="mono right" id="time-label"></span>
            </div>
            <div class="transport-controls">
              <button class="ctrl-btn stop" id="btn-stop" aria-label="Stop">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#F6F1EA"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
              </button>
              <div class="transport-main">
                <button class="ctrl-btn" id="btn-prev" aria-label="Previous">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6F1EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14"></path><path d="M19 5l-10 7 10 7z"></path></svg>
                </button>
                <button class="ctrl-btn play" id="btn-toggle" aria-label="Play or pause"></button>
                <button class="ctrl-btn" id="btn-next" aria-label="Next">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6F1EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14"></path><path d="M5 5l10 7-10 7z"></path></svg>
                </button>
              </div>
              <span></span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- MINI BAR -->
  <div class="minibar" id="minibar">
    <div class="minibar-seek" id="minibar-seek">
      <div class="minibar-seek-fill" id="minibar-seek-fill"></div>
    </div>
    <div class="minibar-row">
      <button class="minibar-now" id="minibar-open">
        <span class="minibar-art">
          <span class="minibar-vinyl" id="minibar-vinyl"><span class="minibar-vinyl-label" id="minibar-vinyl-label"></span></span>
          <span class="minibar-cover" id="minibar-cover"></span>
        </span>
        <span class="minibar-meta">
          <span class="minibar-title" id="minibar-title"></span>
          <span class="minibar-artist" id="minibar-artist"></span>
        </span>
      </button>
      <span class="mono minibar-time" id="minibar-time"></span>
      <button class="ctrl-btn" id="mini-prev" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEE8DF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14"></path><path d="M19 5l-10 7 10 7z"></path></svg>
      </button>
      <button class="ctrl-btn mini-play" id="mini-toggle" aria-label="Play or pause"></button>
      <button class="ctrl-btn" id="mini-next" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEE8DF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14"></path><path d="M5 5l10 7-10 7z"></path></svg>
      </button>
    </div>
  </div>

  <div class="yt-card" id="yt-card"><div id="yt-player"></div></div>

</div>
<script src="config.js"></script>
<script src="youtube.js"></script>
<script src="app.js"></script>
</body>
</html>
